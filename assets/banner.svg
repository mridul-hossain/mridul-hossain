<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',Consolas,Monaco,monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1324"/>
      <stop offset="100%" stop-color="#1B2242"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171C33"/>
      <stop offset="100%" stop-color="#141830"/>
    </linearGradient>
    <style>
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="30" y="30" width="1140" height="260" rx="14" fill="url(#panel)" stroke="#2A3153" stroke-width="1"/>

  <!-- ambient node-graph texture, right side of the panel, clear of the code text -->
  <g stroke="#4FB8A6" stroke-width="1.2" opacity="0.3">
    <line x1="800" y1="120" x2="890" y2="90"/>
    <line x1="890" y1="90" x2="985" y2="130"/>
    <line x1="890" y1="90" x2="945" y2="180"/>
    <line x1="985" y1="130" x2="1075" y2="100"/>
    <line x1="985" y1="130" x2="1050" y2="200"/>
    <line x1="800" y1="120" x2="850" y2="195"/>
    <line x1="850" y1="195" x2="945" y2="180"/>
  </g>
  <g opacity="0.55">
    <circle cx="800" cy="120" r="5" fill="#E8735A"/>
    <circle cx="890" cy="90" r="6" fill="#E8A33D"/>
    <circle cx="985" cy="130" r="5" fill="#4FB8A6"/>
    <circle cx="945" cy="180" r="4.5" fill="#4FB8A6"/>
    <circle cx="1075" cy="100" r="4.5" fill="#E8A33D"/>
    <circle cx="1050" cy="200" r="5" fill="#E8735A"/>
    <circle cx="850" cy="195" r="4.5" fill="#4FB8A6"/>
  </g>

  <!-- title bar -->
  <path d="M30,44 a14,14 0 0 1 14,-14 h1112 a14,14 0 0 1 14,14 v22 h-1140 z" fill="#1E2440"/>
  <circle cx="56" cy="55" r="6" fill="#E8735A"/>
  <circle cx="76" cy="55" r="6" fill="#E8A33D"/>
  <circle cx="96" cy="55" r="6" fill="#4FB8A6"/>
  <text x="600" y="60" font-size="12.5" fill="#7C8496" text-anchor="middle">profile.ts</text>

  <!-- code content -->
  <g font-size="16" xml:space="preserve">
    <text x="58" y="100"><tspan fill="#E8735A">$</tspan><tspan fill="#C7CCDC"> whoami</tspan></text>

    <text x="58" y="140"><tspan fill="#E8735A">const</tspan><tspan fill="#EDEFF5"> engineer</tspan><tspan fill="#7C8496"> = </tspan><tspan fill="#7C8496">{</tspan></text>
    <text x="58" y="164"><tspan fill="#4FB8A6">  name</tspan><tspan fill="#7C8496">: </tspan><tspan fill="#E8A33D">"Md Mridul Hossain"</tspan><tspan fill="#7C8496">,</tspan></text>
    <text x="58" y="188"><tspan fill="#4FB8A6">  role</tspan><tspan fill="#7C8496">: </tspan><tspan fill="#E8A33D">"Full-Stack Software Engineer"</tspan><tspan fill="#7C8496">,</tspan></text>
    <text x="58" y="212"><tspan fill="#4FB8A6">  degree</tspan><tspan fill="#7C8496">: </tspan><tspan fill="#E8A33D">"MEng SWE @ Concordia University"</tspan><tspan fill="#7C8496">,</tspan></text>
    <text x="58" y="236"><tspan fill="#4FB8A6">  stack</tspan><tspan fill="#7C8496">: [</tspan><tspan fill="#E8A33D">"Java"</tspan><tspan fill="#7C8496">, </tspan><tspan fill="#E8A33D">"Python"</tspan><tspan fill="#7C8496">, </tspan><tspan fill="#E8A33D">"PHP"</tspan><tspan fill="#7C8496">, </tspan><tspan fill="#E8A33D">"C#"</tspan><tspan fill="#7C8496">, </tspan><tspan fill="#E8A33D">"JS"</tspan><tspan fill="#7C8496">],</tspan></text>
    <text x="58" y="260"><tspan fill="#4FB8A6">  focus</tspan><tspan fill="#7C8496">: </tspan><tspan fill="#E8A33D">"distributed systems &amp; context-aware apps"</tspan></text>
    <text x="58" y="284"><tspan fill="#7C8496">};</tspan><tspan class="cursor" fill="#EDEFF5">▍</tspan></text>
  </g>
</svg>
